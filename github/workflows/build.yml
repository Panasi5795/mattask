name: Build MatTask

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project (if mattask.zip exists at repo root)
        run: |
          if [ -f mattask.zip ]; then
            unzip -o mattask.zip
          fi
          ls -la

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        working-directory: mattask
        run: gradle build --stacktrace

      - name: Upload build artifacts (jar + logs, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mattask-build-result
          path: |
            mattask/build/libs/*.jar
            mattask/build/reports/**
            mattask/build/**/*.log
          if-no-files-found: warn
